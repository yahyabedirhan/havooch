<!DOCTYPE html>

<title>Feedback session</title>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter Tight', system-ui, sans-serif; background: #131417; color: #e4e6e9; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 1rem; }
.frame { max-width: 1040px; width: 100%; }
.diagram-container { width: 100%; overflow-x: auto; }
.eyebrow { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #8b9097; margin-bottom: 0.5rem; }
h1 { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 600; letter-spacing: -0.01em; line-height: 1.15; color: #e4e6e9; margin-bottom: 1.5rem; }
svg { width: 100%; min-width: 1000px; display: block; }
@media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }

</style>

<body>
<div class="frame">
<p class="eyebrow">Diagram · havooch</p>

<desc id="havooch-feedback-session-desc">User journey of one person giving video feedback to a coding agent with Havooch across six stages, with a confidence line that dips when something looks off, rises once they point at it on the frame, holds while comments go out as one batch and the agent works, and peaks when the answer appears beside the video.</desc>

<linearGradient id="rim-inner" x1="0" y1="0" x2="0" y2="520" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff" stop-opacity="0.14"/><stop offset="1" stop-color="#fff" stop-opacity="0.03"/></linearGradient>

<text x="40" y="414" fill="#8b9097" font-size="7" font-family="'IBM Plex Mono', ui-monospace, monospace" letter-spacing="0.14em">YOU SEE</text>
