<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Review loop</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600&family=Inter+Tight:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter Tight', system-ui, sans-serif; background: #131417; color: #e4e6e9; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 1rem; }
.frame { max-width: 1040px; width: 100%; }
.diagram-container { width: 100%; overflow-x: auto; }
.eyebrow { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #8b9097; margin-bottom: 0.5rem; }
h1 { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 600; letter-spacing: -0.01em; line-height: 1.15; color: #e4e6e9; margin-bottom: 1.5rem; }
svg { width: 100%; min-width: 1000px; display: block; }
@media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
svg .ring { fill: none; stroke: #8b9097; stroke-width: 1.2; }
svg .focal-ring { stroke: #ffffff; stroke-width: 1.4; }
svg .spoke { fill: none; stroke: #6b7078; stroke-width: 1; stroke-dasharray: 5 4; }
svg .station { fill: #222529; stroke: rgba(255,255,255,0.16); stroke-width: 1; }
svg .fold { fill: #ffffff; }
svg .fold-shade { fill: #b9bec4; }
svg .idx { fill: #6b7078; font: 400 9px 'IBM Plex Mono', ui-monospace, monospace; }
svg .fold-idx { fill: #4f545b; }
svg .node-name { fill: #e4e6e9; font: 600 12px 'Inter Tight', system-ui, sans-serif; }
svg .fold-name { fill: #131417; }
svg .sublabel { fill: #8b9097; font: 400 9px 'IBM Plex Mono', ui-monospace, monospace; }
svg .fold-sub { fill: #131417; }
svg .hub-name { fill: #e4e6e9; font: 600 14px 'Inter Tight', system-ui, sans-serif; }
svg .chip { fill: none; stroke: rgba(255,255,255,0.16); stroke-width: 1; }
svg .chip.cur { fill: #ffffff; stroke: none; }
svg .chip-t { fill: #8b9097; font: 400 10px 'IBM Plex Mono', ui-monospace, monospace; text-anchor: middle; }
svg .cur-t { fill: #131417; }
svg .callout { fill: #e4e6e9; font: 400 13px 'Inter Tight', system-ui, sans-serif; }
svg .leader { fill: none; stroke: rgba(228,230,233,0.40); stroke-width: 1; stroke-dasharray: 4 3; }
svg .legend { fill: #8b9097; font: 400 8.5px 'Inter Tight', system-ui, sans-serif; }
svg .legend-h { fill: #8b9097; font: 400 8px 'IBM Plex Mono', ui-monospace, monospace; letter-spacing: 0.18em; }
</style>
</head>
<body>
<div class="frame">
<p class="eyebrow">Diagram · havooch</p>
<h1>Review loop</h1>
<div class="diagram-container">
<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="havooch-review-loop-title havooch-review-loop-desc">
<title id="havooch-review-loop-title">Review loop</title>
<desc id="havooch-review-loop-desc">The Havooch review loop: you watch what your agent built, pause and point at a moment, send every queued comment as one batch, the agent works in your repository and answers on each thread, and a changed video comes back as a new version in your project, which keeps every version and thread.</desc>
<defs>
<linearGradient id="tile" x1="0" y1="0" x2="0" y2="560" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#222529"/><stop offset="1" stop-color="#131417"/></linearGradient>
<linearGradient id="rim-outer" x1="0" y1="0" x2="0" y2="560" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff" stop-opacity="0.32"/><stop offset="1" stop-color="#fff" stop-opacity="0.08"/></linearGradient>
<linearGradient id="rim-inner" x1="0" y1="0" x2="0" y2="560" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff" stop-opacity="0.14"/><stop offset="1" stop-color="#fff" stop-opacity="0.03"/></linearGradient>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8b9097"/></marker>
<marker id="arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6b7078"/></marker>
<marker id="arrow-fold" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="14" refX="15" refY="7" orient="auto"><polygon points="16 7, 0 0, 4 7" fill="#b9bec4"/><polygon points="16 7, 4 7, 0 14" fill="#ffffff"/></marker>
</defs>
<rect width="1000" height="560" rx="12" fill="url(#tile)"/>
<rect x="2" y="2" width="996" height="556" rx="10" fill="none" stroke="url(#rim-outer)" stroke-width="1"/>
<rect x="10" y="10" width="980" height="540" rx="2" fill="none" stroke="url(#rim-inner)" stroke-width="1"/>
<!-- Clockwise ring on one r=188 circle. The arc leaving Send is the focal arrow. -->
<path class="ring" d="M592.000 84.049 A188 188 0 0 1 643.952 127.079" marker-end="url(#arrow)"/>
<path class="ring" d="M676.771 184.000 A188 188 0 0 1 677.176 310.870" marker-end="url(#arrow)"/>
<path class="ring focal-ring" d="M644.720 368.000 A188 188 0 0 1 592.871 411.460" marker-end="url(#arrow-fold)"/>
<path class="ring" d="M408.000 411.951 A188 188 0 0 1 356.048 368.921" marker-end="url(#arrow)"/>
<path class="ring" d="M323.229 312.000 A188 188 0 0 1 322.824 185.130" marker-end="url(#arrow)"/>
<path class="ring" d="M355.280 128.000 A188 188 0 0 1 406.955 84.639" marker-end="url(#arrow)"/>
<!-- Dashed write-backs into the project. -->
<path class="spoke" d="M615.503 184.000 L588.335 197.000" marker-end="url(#arrow-soft)"/>
<path class="spoke" d="M384.497 312.000 L411.665 299.000" marker-end="url(#arrow-soft)"/>
<path class="spoke" d="M384.497 184.000 L411.665 197.000" marker-end="url(#arrow-soft)"/>
<!-- Steps -->
<rect class="station" x="408" y="32" width="184" height="56" rx="2"/>
<text x="422" y="56" class="idx">01</text>
<text x="446" y="56" class="node-name">Watch</text>
<text x="446" y="74" class="sublabel">open what it built</text>
<rect class="station" x="572" y="128" width="184" height="56" rx="2"/>
<text x="586" y="152" class="idx">02</text>
<text x="610" y="152" class="node-name">Pause and point</text>
<text x="610" y="170" class="sublabel">box, comment, thread</text>
<path class="fold" d="M574 312 H742 L756 326 V366 Q756 368 754 368 H574 Q572 368 572 366 V314 Q572 312 574 312 Z"/>
<polygon class="fold-shade" points="742,312 742,326 756,326"/>
<text x="586" y="336" class="idx fold-idx">03</text>
<text x="610" y="336" class="node-name fold-name">Send</text>
<text x="610" y="354" class="sublabel fold-sub">Cmd+Enter, one batch</text>
<rect class="station" x="408" y="408" width="184" height="56" rx="2"/>
<text x="422" y="432" class="idx">04</text>
<text x="446" y="432" class="node-name">Agent works</text>
<text x="446" y="450" class="sublabel">in your repository</text>
<rect class="station" x="244" y="312" width="184" height="56" rx="2"/>
<text x="258" y="336" class="idx">05</text>
<text x="282" y="336" class="node-name">It answers</text>
<text x="282" y="354" class="sublabel">on each thread</text>
<rect class="station" x="244" y="128" width="184" height="56" rx="2"/>
<text x="258" y="152" class="idx">06</text>
<text x="282" y="152" class="node-name">New version</text>
<text x="282" y="170" class="sublabel">joins the same project</text>
<!-- The project keeps every version and thread. -->
<rect class="station" x="400" y="200" width="200" height="96" rx="2"/>
<text x="420" y="230" class="hub-name">Your project</text>
<text x="420" y="248" class="sublabel">every version and thread</text>
<rect class="chip" x="420" y="260" width="36" height="20"/><text x="438" y="274" class="chip-t">v1</text>
<rect class="chip" x="464" y="260" width="36" height="20"/><text x="482" y="274" class="chip-t">v2</text>
<rect class="chip cur" x="508" y="260" width="36" height="20"/><text x="526" y="274" class="chip-t cur-t">v3</text>
<!-- Callouts -->
<path class="leader" d="M212 156 H238"/>
<circle cx="240" cy="156" r="2" fill="#8b9097"/>
<text class="callout" text-anchor="end" x="204" y="141">Each round leaves</text>
<text class="callout" text-anchor="end" x="204" y="161">a new version, so you</text>
<text class="callout" text-anchor="end" x="204" y="181">can see what changed.</text>
<path class="leader" d="M762 340 H788"/>
<circle cx="760" cy="340" r="2" fill="#8b9097"/>
<text class="callout" x="796" y="325">One keystroke sends</text>
<text class="callout" x="796" y="345">every queued comment</text>
<text class="callout" x="796" y="365">as one batch.</text>
<!-- Legend -->
<line x1="40" y1="488" x2="960" y2="488" stroke="rgba(255,255,255,0.10)" stroke-width="0.8"/>
<text x="40" y="504" class="legend-h">LEGEND</text>
<path d="M 40,516 H 49 L 54,521 V 526 H 40 Z" fill="#ffffff"/><polygon points="49,516 49,521 54,521" fill="#b9bec4"/>
<text x="60" y="524" class="legend">The one keystroke</text>
<rect x="150" y="516" width="14" height="10" rx="1" class="station"/>
<text x="170" y="524" class="legend">Step or project</text>
<line x1="250" y1="521" x2="264" y2="521" stroke="#ffffff" stroke-width="1.4"/><polygon points="276,521 260,514 264,521" fill="#b9bec4"/><polygon points="276,521 264,521 260,528" fill="#ffffff"/>
<text x="282" y="524" class="legend">Batch to the agent</text>
<line x1="372" y1="521" x2="394" y2="521" class="ring" marker-end="url(#arrow)"/>
<text x="400" y="524" class="legend">Next step, clockwise</text>
<line x1="500" y1="521" x2="522" y2="521" class="spoke" marker-end="url(#arrow-soft)"/>
<text x="528" y="524" class="legend">Saved to the project</text>
</svg>
</div>
</div>
</body>
</html>
