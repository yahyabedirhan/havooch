<title id="command-routes-title">Command routes</title>
<desc id="command-routes-desc">Almost every havooch command asks the running app through control.sock in its support folder. A few launch the app first when it is not running: open and project add in front, project new and app open in the background, wait keeps trying. The rest fail with: Havooch isn't running. project list, config path and config check read config.toml with no app; app status answers without it when it is not running.</desc>
