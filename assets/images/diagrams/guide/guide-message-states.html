<p class="eyebrow">States · Havooch guide</p><h1>A comment from queued to done</h1>

<title id="guide-message-states-title">A comment from queued to done</title>
<desc id="guide-message-states-desc">A comment starts queued and is the only state you can still edit or delete. Send moves the queue to sent and into the window's outbox. If no agent waits, the sends stay in line until the next wait. The agent's ack makes them acknowledged; status sets working, done or failed. States only move forward, may be skipped, and done and failed are final.</desc>

<text x="24" y="64" fill="#d4d4d4" font-size="16" font-family="'Geist', sans-serif" font-weight="400">Comments queue up until you send; then only the agent moves them on.</text>
<text x="24" y="508" fill="#d4d4d4" font-size="14" font-family="'Geist', sans-serif" font-weight="400">With no agent listening, Send still works: the batch waits in line and the next wait picks it up.</text>
