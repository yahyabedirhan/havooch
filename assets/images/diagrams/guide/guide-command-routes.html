<p class="eyebrow">Routes · Havooch guide</p><h1>Which havooch commands need the app</h1>

<title id="guide-command-routes-title">Which havooch commands need the app</title>
<desc id="guide-command-routes-desc">Almost every havooch command asks the running app through control.sock in its support folder. A few launch the app first when it is not running: open and project add in front, project new and app open in the background, wait keeps trying. The rest fail with: Havooch isn't running. project list, config path and config check read config.toml with no app; app status answers without it when it is not running.</desc>

<text x="324" y="322" fill="#f1b467" font-size="10" font-family="'Geist Mono', monospace">not running: "Havooch isn't running"</text>

<text x="24" y="144" fill="#d4d4d4" font-size="16" font-family="'Geist', sans-serif" font-weight="400">and work with Havooch closed.</text>
<text x="24" y="560" fill="#d4d4d4" font-size="14" font-family="'Geist', sans-serif" font-weight="400">A demo run (app open --demo) has its own folder and socket; the command finds it there first.</text>
