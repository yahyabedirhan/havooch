<h1>Message states</h1>

<title id="message-states-title">Message states</title>
<desc id="message-states-desc">A comment starts queued and is the only state you can still edit or delete. Send moves the queue to sent and into the window's outbox. If no agent waits, the sends stay in line until the next wait. The agent's ack makes them acknowledged; status sets working, done or failed. States only move forward, may be skipped, and done and failed are final.</desc>
