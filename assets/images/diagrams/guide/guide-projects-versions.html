<desc id="guide-projects-versions-desc">A plain video becomes v1 of a project with havooch project new; its threads move in. Each havooch project add appends the next version. config.toml holds the list. Each thread remembers the file of the version it was raised on, so its tag says v2 or Removed version. Compare puts two versions on one playhead side by side, flipped or with a slider; a message goes to the side you pick.</desc>
